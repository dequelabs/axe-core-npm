packages:
  - 'packages/*'
  - 'test/*'
  - '!test/release'

# Five packages drive real browsers in `test`, so bound how many run at once.
workspaceConcurrency: 2

allowBuilds:
  chromedriver: true
  edgedriver: true
  esbuild: true
  geckodriver: true
  nx: true
  puppeteer: true
  unrs-resolver: true
