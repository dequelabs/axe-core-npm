packages:
  - 'packages/*'
  - 'test/*'

# Five packages drive real browsers in `test`, so bound how many run at once.
workspaceConcurrency: 2
# Supply-chain protection: refuse to install packages newer than ~6d23h,
# staying just under Dependabot's default 7-day cooldown.
# Integer in MINUTES. NOT a duration string like "10020m" (silently wrong).
minimumReleaseAge: 10020
# cheerio 1.x is ESM and its `browser` export condition — the one
# jest-environment-jsdom selects — is unloadable from enzyme's CJS require.
# Keyed to enzyme, but webdriverio's `^1.0.0-rc.12` range accepts this too, so
# pnpm dedupes both consumers onto it. Pin until unmaintained enzyme is replaced.
overrides:
  enzyme>cheerio: 1.0.0-rc.12
  # TypeScript 7 is not something we can move to yet.
  typescript: ^6
  # chai 5 is ESM-only.
  chai: ^4
  # Each commander major raises its own Node floor, which would raise the
  # published cli's real floor past the `engines.node` it advertises. Keyed to
  # the cli — unscoped, this cross-major-swaps commander inside build tooling.
  '@axe-core/cli>commander': ^9
  # React 18+ is not supported.
  # @see https://github.com/dequelabs/axe-core-npm/issues/500
  react: ^17
  react-dom: ^17
  '@types/react': ^17
  '@types/react-dom': ^17
  # Keep aligned with the Node.js major being developed on; bump deliberately.
  '@types/node': ^24
allowBuilds:
  chromedriver: true
  edgedriver: true
  esbuild: true
  geckodriver: true
  nx: true
  puppeteer: true
  unrs-resolver: true
