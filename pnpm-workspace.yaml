packages:
  - 'packages/*'
  - 'test/*'
  - '!test/release'

# Five packages drive real browsers in `test`, so bound how many run at once.
workspaceConcurrency: 2
# Supply-chain protection: refuse to install packages newer than ~6d23h,
# staying just under Dependabot's default 7-day cooldown.
# Integer in MINUTES. NOT a duration string like "10020m" (silently wrong).
minimumReleaseAge: 10020
allowBuilds:
  chromedriver: true
  edgedriver: true
  esbuild: true
  geckodriver: true
  nx: true
  puppeteer: true
  unrs-resolver: true
