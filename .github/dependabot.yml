version: 2

updates:
  - package-ecosystem: 'github-actions'
    rebase-strategy: disabled
    directory: '/'
    schedule:
      interval: 'monthly'
    open-pull-requests-limit: 10
    commit-message:
      prefix: 'chore'
    groups:
      # Any updates not caught by the group config will get individual PRs
      gha-low-risk:
        update-types:
          - 'minor'
          - 'patch'
    cooldown:
      default-days: 7

  - package-ecosystem: 'npm'
    rebase-strategy: disabled
    directory: '/'
    schedule:
      interval: 'monthly'
    open-pull-requests-limit: 10
    commit-message:
      prefix: 'chore'
    ignore:
      # Handled separately by its own workflow
      - dependency-name: '@axe-core/*'
      - dependency-name: 'axe-core'
      # Prevent updates to ESM-only versions
      - dependency-name: 'execa'
        versions: ['>=6.0.0']
      - dependency-name: 'node-fetch'
        versions: ['>=3.0.0']
      - dependency-name: 'delay'
        versions: ['>=6.0.0']
      - dependency-name: 'tempy'
        versions: ['>=2.0.0']
      - dependency-name: 'chai'
        versions: ['>=5.0.0']
      - dependency-name: 'lerna'
        versions: ['>=8.1.3']
      # Breaking change due to node version requirements
      - dependency-name: 'commander'
        versions: ['>=10.0.0']
      # Not supported
      # @see https://github.com/dequelabs/axe-core-npm/issues/500
      - dependency-name: 'react'
        versions: ['>=18.0.0']
      - dependency-name: 'react-dom'
        versions: ['>=18.0.0']
      - dependency-name: '@types/react'
        versions: ['>=18.0.0']
      - dependency-name: '@types/react-dom'
        versions: ['>=18.0.0']
      # Keep @types/node aligned with the Node.js major version being developed on
      # to avoid type incompatibilities and unexpected breaking changes
      - dependency-name: '@types/node'
        update-types: ['version-update:semver-major']
    groups:
      # Keep the ESLint toolchain moving in lockstep so configs, plugins,
      # and parsers always land with the eslint major they require.
      # Covers majors so a future eslint major bump doesn't ship without
      # its peer/plugin updates.
      # Enumerate by exact name — glob patterns have been unreliable here.
      # If you add a new eslint-* dep anywhere in this repo, append it here.
      eslint:
        patterns:
          - 'eslint'
          - '@eslint/js'
          - 'eslint-config-prettier'
          - 'eslint-plugin-prettier'
          - 'typescript-eslint'
        update-types:
          - 'major'
          - 'minor'
          - 'patch'
      # Keep the Jest toolchain in lockstep so the runner, its environments,
      # and the TypeScript transform always land with the jest major they
      # require.
      # Enumerate by exact name — glob patterns have been unreliable here.
      # If you add a new jest-* dep anywhere in this repo, append it here.
      jest:
        patterns:
          - 'jest'
          - 'jest-environment-jsdom'
          - 'ts-jest'
        update-types:
          - 'major'
          - 'minor'
          - 'patch'
      # Browser-driver integrations: keep each framework and its directly
      # related packages (types, scoped sub-packages, protocol shims) moving
      # in lockstep, including majors, so a framework major never lands
      # without its companion packages.
      # Enumerate by exact name — glob patterns have been unreliable here.
      # If you add a new package for one of these frameworks, append it here.
      selenium:
        patterns:
          - 'selenium-webdriver'
          - '@types/selenium-webdriver'
        update-types:
          - 'major'
          - 'minor'
          - 'patch'
      webdriverio:
        patterns:
          - 'webdriverio'
          - '@wdio/globals'
          - 'devtools'
        update-types:
          - 'major'
          - 'minor'
          - 'patch'
      playwright:
        patterns:
          - 'playwright'
          - 'playwright-core'
          - '@playwright/test'
        update-types:
          - 'major'
          - 'minor'
          - 'patch'
      puppeteer:
        patterns:
          - 'puppeteer'
          - 'puppeteer-core'
        update-types:
          - 'major'
          - 'minor'
          - 'patch'
      # Standalone browser-driver binaries shared across the selenium and
      # webdriverio integrations, so they belong to neither framework group.
      browser-drivers:
        patterns:
          - 'chromedriver'
          - 'geckodriver'
        update-types:
          - 'major'
          - 'minor'
          - 'patch'
      # Any updates not caught by the group config will get individual PRs
      npm-low-risk:
        update-types:
          - 'minor'
          - 'patch'
    cooldown:
      default-days: 7
