version: 2

updates:
  - package-ecosystem: 'github-actions'
    rebase-strategy: disabled
    directory: '/'
    schedule:
      interval: 'monthly'
    open-pull-requests-limit: 10
    commit-message:
      prefix: 'chore'
    groups:
      # Any updates not caught by the group config will get individual PRs
      gha-low-risk:
        update-types:
          - 'minor'
          - 'patch'
    cooldown:
      default-days: 7

  - package-ecosystem: 'npm'
    rebase-strategy: disabled
    directory: '/'
    schedule:
      interval: 'monthly'
    open-pull-requests-limit: 10
    commit-message:
      prefix: 'chore'
    ignore:
      # Handled separately by its own workflow
      - dependency-name: '@axe-core/*'
      - dependency-name: 'axe-core'
      # Prevent updates to ESM-only versions
      - dependency-name: 'chai'
        versions: ['>=5.0.0']
      # Each major raises commander's own Node floor, which would raise the
      # published cli's real floor past the `engines.node` it advertises.
      - dependency-name: 'commander'
        versions: ['>=10.0.0']
      # Not supported
      # @see https://github.com/dequelabs/axe-core-npm/issues/500
      - dependency-name: 'react'
        versions: ['>=18.0.0']
      - dependency-name: 'react-dom'
        versions: ['>=18.0.0']
      - dependency-name: '@types/react'
        versions: ['>=18.0.0']
      - dependency-name: '@types/react-dom'
        versions: ['>=18.0.0']
      # Keep @types/node aligned with the Node.js major version being developed on
      # to avoid type incompatibilities and unexpected breaking changes
      - dependency-name: '@types/node'
        update-types: ['version-update:semver-major']
      # TypeScript 7 is not something we can move to yet
      - dependency-name: 'typescript'
        update-types: ['version-update:semver-major']
    groups:
      # Keep the ESLint toolchain moving in lockstep so configs, plugins,
      # and parsers always land with the eslint major they require.
      # Covers majors so a future eslint major bump doesn't ship without
      # its peer/plugin updates.
      # Enumerate by exact name — glob patterns have been unreliable here.
      # If you add a new eslint-* dep anywhere in this repo, append it here.
      eslint:
        patterns:
          - 'eslint'
          - '@eslint/js'
          - 'eslint-config-prettier'
          - 'eslint-plugin-prettier'
          - 'typescript-eslint'
        update-types:
          - 'major'
          - 'minor'
          - 'patch'
      # Batch the Jest toolchain into one PR so the runner, its environment,
      # and the TypeScript transform update together. Covers majors so a
      # future jest major doesn't ship without the environment/transform
      # updates it needs. Grouping batches the PRs; it does not by itself
      # guarantee peer-compatible versions, so sanity-check a jest major bump.
      # Enumerate by exact name — glob patterns have been unreliable here.
      # If you add a new jest-* dep anywhere in this repo, append it here.
      jest:
        patterns:
          - 'jest'
          - '@jest/globals'
          - 'jest-environment-jsdom'
          - 'ts-jest'
        update-types:
          - 'major'
          - 'minor'
          - 'patch'
      # Browser-driver integrations: keep each framework and its directly
      # related packages (types, scoped sub-packages, protocol shims) moving
      # in lockstep, including majors, so a framework major never lands
      # without its companion packages.
      # Enumerate by exact name — glob patterns have been unreliable here.
      # If you add a new package for one of these frameworks, append it here.
      selenium:
        patterns:
          - 'selenium-webdriver'
          - '@types/selenium-webdriver'
        update-types:
          - 'major'
          - 'minor'
          - 'patch'
      webdriverio:
        patterns:
          - 'webdriverio'
          - '@wdio/cli'
          - '@wdio/globals'
          - '@wdio/local-runner'
          - '@wdio/mocha-framework'
          - '@wdio/spec-reporter'
          - '@wdio/types'
          - 'devtools'
        update-types:
          - 'major'
          - 'minor'
          - 'patch'
      playwright:
        patterns:
          - '@playwright/test'
        update-types:
          - 'major'
          - 'minor'
          - 'patch'
      puppeteer:
        patterns:
          - 'puppeteer'
        update-types:
          - 'major'
          - 'minor'
          - 'patch'
      # The chromedriver binary and its types are used by the cli (selenium)
      # and webdriverio packages, so they belong to neither framework group;
      # keep the binary and its @types package landing together.
      browser-drivers:
        patterns:
          - 'chromedriver'
          - '@types/chromedriver'
        update-types:
          - 'major'
          - 'minor'
          - 'patch'
      # Any updates not caught by the group config will get individual PRs
      npm-low-risk:
        update-types:
          - 'minor'
          - 'patch'
    cooldown:
      default-days: 7
