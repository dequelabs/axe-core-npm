name: Tests

on:
  pull_request:
  push:
    branches:
      - master
      - develop
      - release-*

jobs:
  lint:
    runs-on: ubuntu-latest
    timeout-minutes: 5
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
      # `standalone` installs `@pnpm/exe`, which bundles its own Node, so pnpm 11
      # runs on the Node 18 and 20 matrix legs it would otherwise refuse.
      - uses: pnpm/action-setup@0977fd99725f1db4007ccb2928dbb4e90d06cc86 # v6.0.10
        with:
          standalone: true
      - uses: actions/setup-node@820762786026740c76f36085b0efc47a31fe5020 # v7.0.0
        with:
          node-version-file: .nvmrc
          cache: 'pnpm'
      - run: pnpm install --frozen-lockfile
      - run: pnpm run lint

  puppeteer:
    strategy: &strategy_matrix
      fail-fast: false
      matrix:
        node: [18, 20, 22, 24]
        include:
          - node: 24
            version: '24.15.0'
    runs-on: deque-ubuntu-latest-4core
    timeout-minutes: 15
    needs: lint
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
      - uses: pnpm/action-setup@0977fd99725f1db4007ccb2928dbb4e90d06cc86 # v6.0.10
        with:
          standalone: true
      - uses: actions/setup-node@820762786026740c76f36085b0efc47a31fe5020 # v7.0.0
        with:
          node-version: ${{ matrix.version || matrix.node }}
          cache: 'pnpm'
      - run: pnpm install --frozen-lockfile
      # HACK: Force a TTY to enable browser-driver-manager to manipulate stdout.
      - shell: 'script -q -e -c "bash {0}"'
        run: pnpm exec browser-driver-manager install chrome@145
        working-directory: packages/puppeteer
      - run: pnpm --filter @axe-core/puppeteer run build
      - run: pnpm --filter @axe-core/puppeteer run coverage
      - run: pnpm --filter @axe-core/puppeteer run test:export

  cli:
    strategy: *strategy_matrix
    runs-on: ubuntu-latest
    timeout-minutes: 15
    needs: lint
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
      - uses: pnpm/action-setup@0977fd99725f1db4007ccb2928dbb4e90d06cc86 # v6.0.10
        with:
          standalone: true
      - uses: actions/setup-node@820762786026740c76f36085b0efc47a31fe5020 # v7.0.0
        with:
          node-version: ${{ matrix.version || matrix.node }}
          cache: 'pnpm'
      - run: pnpm install --frozen-lockfile
        # HACK: Force a TTY to enable browser-driver-manager to manipulate stdout.
      - shell: 'script -q -e -c "bash {0}"'
        run: pnpm exec browser-driver-manager install chrome@145
        working-directory: packages/cli
      - run: pnpm --filter @axe-core/cli run coverage

  webdriverjs:
    strategy: *strategy_matrix
    runs-on: ubuntu-latest
    timeout-minutes: 15
    needs: lint
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
      - uses: pnpm/action-setup@0977fd99725f1db4007ccb2928dbb4e90d06cc86 # v6.0.10
        with:
          standalone: true
      - uses: actions/setup-node@820762786026740c76f36085b0efc47a31fe5020 # v7.0.0
        with:
          node-version: ${{ matrix.version || matrix.node }}
          cache: 'pnpm'
      - run: pnpm install --frozen-lockfile
      # HACK: Force a TTY to enable browser-driver-manager to manipulate stdout.
      - shell: 'script -q -e -c "bash {0}"'
        run: pnpm exec browser-driver-manager install chrome@145
        working-directory: packages/webdriverjs
      - run: pnpm --filter @axe-core/webdriverjs run build
      - run: pnpm --filter @axe-core/webdriverjs run coverage
      - run: pnpm --filter @axe-core/webdriverjs run test:export

  webdriverio:
    strategy: *strategy_matrix
    runs-on: ubuntu-latest
    timeout-minutes: 15
    needs: lint
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
      - uses: pnpm/action-setup@0977fd99725f1db4007ccb2928dbb4e90d06cc86 # v6.0.10
        with:
          standalone: true
      - uses: actions/setup-node@820762786026740c76f36085b0efc47a31fe5020 # v7.0.0
        with:
          node-version: ${{ matrix.version || matrix.node }}
          cache: 'pnpm'
      - run: pnpm install --frozen-lockfile
      # HACK: Force a TTY to enable browser-driver-manager to manipulate stdout.
      - shell: 'script -q -e -c "bash {0}"'
        run: pnpm exec browser-driver-manager install chrome@145
        working-directory: packages/webdriverio
      - run: pnpm --filter @axe-core/webdriverio run build
      - run: pnpm --filter @axe-core/webdriverio run coverage
      - run: pnpm --filter @axe-core/webdriverio run test:export

  reporter_earl:
    strategy: *strategy_matrix
    runs-on: ubuntu-latest
    timeout-minutes: 15
    needs: lint
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
      - uses: pnpm/action-setup@0977fd99725f1db4007ccb2928dbb4e90d06cc86 # v6.0.10
        with:
          standalone: true
      - uses: actions/setup-node@820762786026740c76f36085b0efc47a31fe5020 # v7.0.0
        with:
          node-version: ${{ matrix.version || matrix.node }}
          cache: 'pnpm'
      - run: pnpm install --frozen-lockfile
      - run: pnpm --filter @axe-core/reporter-earl run build
      - run: pnpm --filter @axe-core/reporter-earl run test
      - run: pnpm --filter @axe-core/reporter-earl run test:export

  react:
    strategy: *strategy_matrix
    runs-on: ubuntu-latest
    timeout-minutes: 15
    needs: lint
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
      - uses: pnpm/action-setup@0977fd99725f1db4007ccb2928dbb4e90d06cc86 # v6.0.10
        with:
          standalone: true
      - uses: actions/setup-node@820762786026740c76f36085b0efc47a31fe5020 # v7.0.0
        with:
          node-version: ${{ matrix.version || matrix.node }}
          cache: 'pnpm'
      - run: pnpm install --frozen-lockfile
      - run: pnpm --filter @axe-core/react run test
      # the tests builds the project using tsc and relies on `cache.ts` to be
      # built and be it's own file. however we don't want that for the export
      # test so we need to rebuild using tsup
      - run: pnpm --filter @axe-core/react run build
      - run: pnpm --filter @axe-core/react run test:export

  playwright:
    strategy: *strategy_matrix
    runs-on: ubuntu-latest
    timeout-minutes: 25
    needs: lint
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
      - uses: pnpm/action-setup@0977fd99725f1db4007ccb2928dbb4e90d06cc86 # v6.0.10
        with:
          standalone: true
      - uses: actions/setup-node@820762786026740c76f36085b0efc47a31fe5020 # v7.0.0
        with:
          node-version: ${{ matrix.version || matrix.node }}
          cache: 'pnpm'
      - run: pnpm install --frozen-lockfile
      - run: pnpm --filter @axe-core/playwright exec playwright install --with-deps
      - run: pnpm --filter @axe-core/playwright run build
      - run: pnpm --filter @axe-core/playwright run coverage
      - run: pnpm --filter @axe-core/playwright run test:export

  wdio_globals_test:
    strategy: *strategy_matrix
    runs-on: ubuntu-latest
    timeout-minutes: 15
    needs: lint
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
      - uses: pnpm/action-setup@0977fd99725f1db4007ccb2928dbb4e90d06cc86 # v6.0.10
        with:
          standalone: true
      - uses: actions/setup-node@820762786026740c76f36085b0efc47a31fe5020 # v7.0.0
        with:
          node-version: ${{ matrix.version || matrix.node }}
          cache: 'pnpm'
      - run: pnpm install --frozen-lockfile
      - run: pnpm --filter wdio-tests run test

  axe_core_test:
    if: github.ref_name == 'master' || startsWith(github.ref_name, 'release')
    runs-on: ubuntu-latest
    timeout-minutes: 5
    needs: lint
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
      - uses: pnpm/action-setup@0977fd99725f1db4007ccb2928dbb4e90d06cc86 # v6.0.10
        with:
          standalone: true
      - uses: actions/setup-node@820762786026740c76f36085b0efc47a31fe5020 # v7.0.0
        with:
          node-version-file: .nvmrc
          cache: 'pnpm'
      - run: pnpm install --frozen-lockfile
      - run: pnpm --filter axe_core_test run test
