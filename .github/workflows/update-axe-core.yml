name: Update axe-core

on:
  workflow_dispatch:

jobs:
  build:
    runs-on: ubuntu-latest
    timeout-minutes: 10
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
      - uses: pnpm/action-setup@ea17c68df8912ef543352723c149a84f56e3d413 # v6.1.0
        with:
          standalone: true
      - uses: actions/setup-node@820762786026740c76f36085b0efc47a31fe5020 # v7.0.0
        with:
          node-version-file: .nvmrc
      - uses: dequelabs/axe-api-team-public/.github/actions/create-update-axe-core-pull-request-v1@272a2eb86605251b73995fb158f30c3641e75593 # v1
        with:
          token: ${{ secrets.PAT }}
          # Disable the action's own checkout and Node setup; the steps above
          # already put pnpm on PATH before it runs `pnpm add`.
          should-checkout: false
          should-setup-node: false
